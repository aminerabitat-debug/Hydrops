name: Deploy frontend to GitHub Pages

# Construit apps/web (Vite) et publie sur GitHub Pages a chaque push sur main. VITE_API_BASE_URL
# est fige au moment du build (Vite l'inline dans le bundle, pas une variable runtime) — pointe
# vers le backend deploye separement sur Render (cf. render.yaml a la racine).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api.hyprmodeling.com/api/v1
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
