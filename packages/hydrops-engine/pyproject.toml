[project]
name = "hydrops-engine"
version = "0.1.0"
description = "Moteur de calcul HydroPS (topologie, hydraulique, optimisation, economie, tranchee) - package pur, sans IO"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hydrops_engine*"]
