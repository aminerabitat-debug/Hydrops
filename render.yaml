# Blueprint Render pour le backend FastAPI (apps/api) — deploiement "New + > Blueprint" sur
# render.com en pointant sur ce depot GitHub. Le build reste a la racine du monorepo (pas de
# rootDir sur apps/api) car requirements.txt installe packages/hydrops-engine et packages/hydropack
# en editable via des chemins relatifs (-e ../../packages/...), qui doivent rester valides.
services:
  - type: web
    name: hydrops-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn hydrops_api.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: HYDROPS_CORS_ORIGINS
        value: '["https://hyprmodeling.com"]'
